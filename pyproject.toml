[project]
name = "ml-cloudrun-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chaka Bannour", email = "abderrazek.chaka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ml-cloudrun-demo = "ml_cloudrun_demo:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
api = [
    "fastapi>=0.165.0",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]
causal = [
    "doubleml>=0.11.4",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
train = [
    "ipython>=9.18.1",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]
ui = [
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]
